<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<!-- security-baseline:start -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'none'; object-src 'none'; script-src 'self' 'sha256-MvVMNPjWe1wagRLpZ49XHw52oUMTW/3zF2mnBX66XyA='; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self'; frame-src https://script.google.com https://script.googleusercontent.com https://accounts.google.com; form-action 'self'; media-src 'self' blob:; worker-src 'self' blob:; manifest-src 'self'; upgrade-insecure-requests">
<meta name="referrer" content="no-referrer">
<!-- security-baseline:end -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>SHS New Client Desk</title>
<meta name="theme-color" content="#1E2A6E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SHS Desk">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  :root { --navy:#1E2A6E; --blue:#1F6FB4; --red:#B01E35; --bg:#F3F5FA; --ink:#141B3A; --muted:#5A6384; }
  * { box-sizing:border-box }
  html, body { margin:0; height:100%; background:#fff; color:var(--ink); font-family:system-ui,"Segoe UI",Roboto,sans-serif }
  body { padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px) }
  #app { position:fixed; inset:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px) 0; width:100%; height:calc(100% - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)); border:0; background:#fff }
  .splash { position:fixed; inset:0; display:grid; place-items:center; background:#fff; z-index:2; transition:opacity .3s }
  .splash.done { opacity:0; pointer-events:none }
  .splash div { text-align:center; padding:16px }
  .splash img { width:132px; height:auto }
  .splash p { color:var(--muted); font-size:14px; margin:14px 0 0 }
  .bar { width:132px; height:3px; margin:16px auto 0; background:linear-gradient(90deg,var(--red) 0 44%,transparent 44% 56%,var(--red) 56%); border-radius:2px }
  .offline { position:fixed; inset:0; display:none; place-items:center; background:var(--bg); z-index:3; padding:16px; text-align:center }
  .offline.show { display:grid }
  .offline h1 { font-size:18px; color:var(--navy); margin:12px 0 6px }
  .offline p { color:var(--muted); margin:0 0 16px; font-size:14px }
  button { font:600 14px system-ui,"Segoe UI",sans-serif; border-radius:8px; padding:10px 16px; border:1px solid var(--navy); background:var(--navy); color:#fff; cursor:pointer }
  button.ghost { background:#fff; color:var(--navy) }
  .install { position:fixed; left:12px; right:12px; bottom:calc(12px + env(safe-area-inset-bottom,0px)); z-index:4; background:#fff; border:1px solid #DCE1EE; border-radius:12px; box-shadow:0 8px 28px rgba(20,27,58,.18); padding:14px; display:none; gap:12px; align-items:center }
  .install.show { display:flex }
  .install img { width:44px; height:44px; border-radius:10px; border:1px solid #DCE1EE }
  .install .t { flex:1; font-size:13px; color:var(--muted); min-width:0 }
  .install .t b { display:block; color:var(--ink); font-size:14px }
  .install .acts { display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end }
  @media (prefers-reduced-motion:reduce) { .splash { transition:none } }
</style>
</head>
<body>
<div class="splash" id="splash"><div><img src="icon-512.png" alt="SHS"><div class="bar"></div><p>Memuat New Client Desk…</p></div></div>
<div class="offline" id="offline"><div><img src="icon-192.png" alt="SHS" width="72" height="72"><h1>Tidak ada koneksi internet</h1><p>New Client Desk butuh internet untuk membaca dan menyimpan data.</p><button type="button" id="retry-connection">Coba lagi</button></div></div>
<iframe id="app" title="SHS New Client Desk" allow="clipboard-write" referrerpolicy="no-referrer"></iframe>
<div class="install" id="install" role="dialog" aria-label="Pasang aplikasi">
  <img src="icon-192.png" alt="">
  <div class="t" id="installText"><b>Pasang SHS Desk di HP</b>Buka lebih cepat dari layar utama, tampil layar penuh.</div>
  <div class="acts"><button type="button" class="ghost" id="later">Nanti</button><button type="button" id="doInstall">Pasang</button></div>
</div>
<script>
(function () {
  "use strict";
  document.getElementById("retry-connection").addEventListener("click", function () { location.reload(); });
  // URL halaman kantor Apps Script. Bila membuat "Deployment baru", ganti URL ini.
  var APP_URL = "https://script.google.com/macros/s/AKfycbwJr8SteM8TiEFzjtsjAfytF4QToZXzuKzzMFMyYxrgnNeGL7Rh3BNl1-lEO9VgO-ON/exec?page=kantor";

  var frame = document.getElementById("app"), splash = document.getElementById("splash"), offline = document.getElementById("offline");
  function ready() { splash.classList.add("done"); }
  if (!navigator.onLine) { offline.classList.add("show"); ready(); }
  else { frame.addEventListener("load", ready); frame.src = APP_URL; setTimeout(ready, 15000); }
  window.addEventListener("online", function () { if (offline.classList.contains("show")) location.reload(); });

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
  }

  // Install prompt, only in a normal browser tab (not once installed).
  var standalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
  var box = document.getElementById("install"), btn = document.getElementById("doInstall"), txt = document.getElementById("installText");
  var dismissed = false; try { dismissed = localStorage.getItem("shs_install_later") === "1"; } catch (_) {}
  var deferred = null;
  function show() { if (!standalone && !dismissed) box.classList.add("show"); }
  window.addEventListener("beforeinstallprompt", function (e) { e.preventDefault(); deferred = e; show(); });
  window.addEventListener("appinstalled", function () { box.classList.remove("show"); });
  btn.addEventListener("click", function () {
    if (deferred) { deferred.prompt(); deferred.userChoice.finally(function () { deferred = null; box.classList.remove("show"); }); }
    else box.classList.remove("show");
  });
  document.getElementById("later").addEventListener("click", function () {
    box.classList.remove("show"); try { localStorage.setItem("shs_install_later", "1"); } catch (_) {}
  });
  var ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  if (ios && !standalone) {
    txt.innerHTML = "<b>Pasang SHS Desk di iPhone</b>Ketuk tombol Bagikan (kotak dengan panah ke atas), lalu pilih <b style=\"display:inline\">Tambah ke Layar Utama</b>.";
    btn.textContent = "Mengerti";
    setTimeout(show, 2500);
  }
})();
</script>
</body>
</html>
