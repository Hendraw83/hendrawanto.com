<title>KKP Kas &amp; Setara Kas | Hendrawanto</title><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap">
<style>
/* Kertas kerja audit B.1.1 Kas & Setara Kas — top bar, tab per kertas kerja, satu lembar kerja per tab */
:root{
--bg:#F3F5F7; --surface:#FFFFFF; --sunk:#EAEEF2; --line:#D5DCE3; --ink:#15212C; --muted:#5A6878;
--accent:#1D5C86; --accent-soft:#E1ECF4; --input:#FFFBEA; --input-ink:#0B4F8A;
--chip:#FFFFFF; --ok:#1E7A4C; --ok-soft:#E0F2E8; --bad:#B4372B; --bad-soft:#F8E3E0; --warn:#9A6200; --warn-soft:#FBEFD5; --aux:#F1F2F4;
--f-display:"Source Serif 4",Georgia,"Times New Roman",serif;
--f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
--f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
--bg:#0F161D; --surface:#16202A; --sunk:#1C2833; --line:#2B3947; --ink:#E4EAF0; --muted:#95A4B3;
--accent:#7DB6DE; --accent-soft:#1B3246; --input:#23291C; --input-ink:#9CCBF2;
--ok:#6FCB98; --ok-soft:#173226; --bad:#F08A7E; --bad-soft:#3A1E1B; --warn:#E8B860; --warn-soft:#352914; --aux:#1A232D; color-scheme:dark}}
:root[data-theme="dark"]{
--bg:#0F161D; --surface:#16202A; --sunk:#1C2833; --line:#2B3947; --ink:#E4EAF0; --muted:#95A4B3;
--accent:#7DB6DE; --accent-soft:#1B3246; --input:#23291C; --input-ink:#9CCBF2;
--ok:#6FCB98; --ok-soft:#173226; --bad:#F08A7E; --bad-soft:#3A1E1B; --warn:#E8B860; --warn-soft:#352914; --aux:#1A232D; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body);margin:0}
.wrap{max-width:1500px;margin:0 auto;padding:0 16px 24px}
header.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between;padding-block:20px 14px;border-bottom:1px solid var(--line)}
.brand{display:flex;gap:14px;align-items:center;min-width:0}
.logo-chip{flex:none;display:inline-flex;background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.logo-chip img{display:block;height:50px;width:auto}
.brand .kap{margin:0 0 3px;font-size:.68rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.brand h1{font:700 1.5rem/1.15 var(--f-display);margin:0;text-wrap:balance}
.brand p{margin:4px 0 0;color:var(--muted);font-size:.8rem}
.picker{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,input[type=text],input[type=date],input[type=time],textarea{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0}
textarea{width:100%;resize:vertical;background:var(--input);color:var(--input-ink);line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 12px;font-weight:500}
button:hover:not(:disabled){border-color:var(--accent)}
button:disabled{opacity:.5;cursor:default}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
button.danger{color:var(--bad);border-color:var(--bad)}
button.small{padding:3px 9px;font-size:.78rem}
button.x{padding:0 7px;font-size:.9rem;line-height:1.6;color:var(--muted)}
button.x:hover{color:var(--bad);border-color:var(--bad)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.status{font-size:.75rem;color:var(--muted);white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:6px 12px}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--surface)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:20px;scrollbar-width:thin}
nav.tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;padding:10px 11px;color:var(--muted);white-space:nowrap;text-align:left;line-height:1.25}
nav.tabs button small{display:block;font:500 .64rem/1.2 var(--f-mono);color:var(--accent);letter-spacing:.02em}
nav.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
nav.tabs .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-left:6px;vertical-align:1px}
.dot.ok{background:var(--ok)} .dot.bad{background:var(--bad)} .dot.warn{background:var(--warn)}
h2{font:600 1.3rem/1.25 var(--f-display);margin:0 0 4px;text-wrap:balance}
h3{font:600 .74rem/1.3 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:26px 0 10px}
.sub{color:var(--muted);margin:0 0 14px;max-width:100ch}
.wphead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:12px}
.ref{font:500 .78rem var(--f-mono);color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:4px;display:inline-block;margin-bottom:6px}
.signoff{display:grid;grid-template-columns:auto 130px 130px;gap:4px 8px;align-items:center;font-size:.75rem;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.signoff input{padding:3px 6px;font-size:.78rem;background:var(--input);color:var(--input-ink)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:12px 0}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;min-width:0}
.kpi .lbl{font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kpi .val{font:500 1.15rem/1.3 var(--f-mono);margin-top:6px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi .note{font-size:.74rem;color:var(--muted);margin-top:3px}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:.72rem;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.neutral{background:var(--sunk);color:var(--muted)}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.82rem}
th,td{padding:5px 7px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
thead th{background:var(--sunk);font-weight:600;font-size:.7rem;color:var(--muted);vertical-align:bottom}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
td.c,th.c{text-align:center}
tfoot td,tr.tot td{font-weight:600;background:var(--sunk)}
tr.sec td{background:var(--accent-soft);font-weight:600;font-size:.75rem;letter-spacing:.04em;color:var(--accent)}
tr.grand td{font-weight:700;border-top:2px solid var(--ink)}
td.bad{color:var(--bad);font-weight:600} td.okc{color:var(--ok)}
td input,td select{width:100%;padding:4px 6px;border-radius:4px;background:var(--input);color:var(--input-ink);border:1px solid transparent;font-size:.82rem}
td input:hover,td select:hover{border-color:var(--line)}
td input[type=checkbox]{width:auto}
td input.num,.frow input.num{text-align:right;font-family:var(--f-mono)}
td input.num{min-width:118px} td input.sm{min-width:64px} td input.md{min-width:110px} td input.txt{min-width:180px}
td input[type=date]{min-width:128px}
td select{min-width:120px}
.proc{font-size:.8rem;line-height:1.45;max-width:70ch;white-space:pre-line}
.proc b{display:block;margin-bottom:2px}
.frm{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:4px 24px}
.frow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.frow label{font-weight:500;font-size:.84rem}
.frow input,.frow select{width:100%;background:var(--input);color:var(--input-ink);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.frow .out{font-family:var(--f-mono);text-align:right;padding-right:8px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
.note-box{border-left:3px solid var(--accent);background:var(--accent-soft);padding:10px 14px;border-radius:0 6px 6px 0;font-size:.84rem;max-width:120ch;margin:12px 0}
.warn-box{border-left:3px solid var(--bad);background:var(--bad-soft);padding:10px 14px;border-radius:0 6px 6px 0;font-size:.84rem;margin:12px 0}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:16px}
.two>*{min-width:0}
.card-list{display:grid;gap:10px}
.issue{display:flex;gap:10px;align-items:baseline;border-bottom:1px solid var(--line);padding:7px 0;font-size:.84rem}
.issue:last-child{border-bottom:0}
.issue button{margin-left:auto}
.steps{margin:0;padding-left:20px;font-size:.84rem;line-height:1.6}
.notes-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;margin-top:22px}
.notes-grid label{display:block;font:600 .72rem/1.3 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.opn{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:18px}
.opn-head{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-bottom:10px}
.opn-head h3{margin:0}
.letter{background:#fff;color:#1a1a1a;border:1px solid var(--line);border-radius:6px;padding:28px 34px;font:13px/1.55 Georgia,"Times New Roman",serif;max-width:820px;margin-top:12px}
.letter table{font-size:12px} .letter th,.letter td{border:1px solid #bbb;padding:4px 6px;color:#1a1a1a} .letter thead th{background:#eee;color:#333}
.letter h4{text-align:center;margin:0 0 12px;font-size:14px;letter-spacing:.04em}
.letter .lh{border-bottom:2px solid #1a1a1a;padding-bottom:6px;margin-bottom:14px}
.letter .lh b{font-size:15px}
.empty{text-align:center;padding:48px 16px}
.dialog{position:fixed;inset:0;background:rgba(10,18,26,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.dialog .box{background:var(--surface);border-radius:10px;border:1px solid var(--line);padding:20px;max-width:640px;width:100%;max-height:90vh;overflow:auto}
.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:14px}
.rep-opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:8px 0 4px}
.rep-opt{display:grid;gap:5px;text-align:left;padding:14px;border-radius:8px;align-content:start}
.rep-opt strong{font:600 1.05rem/1.2 var(--f-display);color:var(--accent)}
.rep-opt span{font-size:.78rem;color:var(--muted);font-weight:400;line-height:1.45}
.rep-opt:hover:not(:disabled){background:var(--accent-soft)}
.foot{margin-top:40px;padding-block:16px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:space-between;color:var(--muted);font-size:.75rem}
.mono{font-family:var(--f-mono)} .muted{color:var(--muted)} .small{font-size:.78rem}
@media (max-width:720px){.frow{grid-template-columns:1fr}.signoff{grid-template-columns:auto 1fr 1fr}.letter{padding:18px}}
</style>

</head><body>

<script>
/* ============ Bahasa ============ */
const PUBLIK=true; // true pada versi gratis di hendrawanto.com (data hanya di memori halaman)
let lang="id"; try{ lang=localStorage.getItem("kas-lang")||"id"; }catch(_){}
try{ const q=new URLSearchParams(location.search).get("lang"); if(q==="en"||q==="id") lang=q; }catch(_){}
const tt=(i,e)=>lang==="en"?e:i;
const KAP="KAP Sutrisno Hendrawanto Sukardi dan Rekan";

/* ============ Format ============ */
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=v=>{ const n=+v; return isFinite(n)?n:0; };
const r2=v=>Math.round(v*100)/100;
const loc=()=>lang==="en"?"en-US":"id-ID";
function fmt(v,dec=0){ v=r2(num(v)); if(Math.abs(v)<0.005) return "-"; const s=Math.abs(v).toLocaleString(loc(),{minimumFractionDigits:dec,maximumFractionDigits:dec}); return v<0?`(${s})`:s; }
function fmtIn(v){ if(v===""||v==null) return ""; return num(v).toLocaleString(loc(),{maximumFractionDigits:4}); }
function pct(v){ if(v==null||!isFinite(v)) return "-"; return (v*100).toLocaleString(loc(),{maximumFractionDigits:1})+"%"; }
function parseNum(s){
  s=String(s).trim().replace(/\s|Rp|IDR/gi,""); if(!s) return 0; let neg=false;
  if(/^\(.*\)$/.test(s)){ neg=true; s=s.slice(1,-1); }
  if(s.startsWith("-")){ neg=!neg; s=s.slice(1); }
  if(lang==="en"){ s=s.replace(/,/g,""); }
  else if(/,\d*$/.test(s)||(s.includes(",")&&s.includes("."))) s=s.replace(/\./g,"").replace(",",".");
  else if(/^\d{1,3}(\.\d{3})+$/.test(s)) s=s.replace(/\./g,"");
  const v=parseFloat(s); return isNaN(v)?0:(neg?-v:v);
}
const BLN_ID=["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
const BLN_EN=["January","February","March","April","May","June","July","August","September","October","November","December"];
const HARI_ID=["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"], HARI_EN=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
function pd(iso){ const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(iso||""); return m?{y:+m[1],m:+m[2],d:+m[3]}:null; }
function fmtDate(iso,L){ L=L||lang; const t=pd(iso); if(!t) return "-"; return L==="en"?`${BLN_EN[t.m-1]} ${t.d}, ${t.y}`:`${t.d} ${BLN_ID[t.m-1]} ${t.y}`; }
function fmtDs(iso){ const t=pd(iso); if(!t) return ""; return `${String(t.d).padStart(2,"0")}/${String(t.m).padStart(2,"0")}/${t.y}`; }
function dayName(iso,L){ const t=pd(iso); if(!t) return ""; const d=new Date(Date.UTC(t.y,t.m-1,t.d)).getUTCDay(); return (L||lang)==="en"?HARI_EN[d]:HARI_ID[d]; }
function addDays(iso,n){ const t=pd(iso); if(!t) return ""; const d=new Date(Date.UTC(t.y,t.m-1,t.d+n)); return d.toISOString().slice(0,10); }
function diffDays(a,b){ const x=pd(a),y=pd(b); if(!x||!y) return null; return Math.round((Date.UTC(y.y,y.m-1,y.d)-Date.UTC(x.y,x.m-1,x.d))/864e5); }
const sum=(a,f)=>a.reduce((s,x)=>s+num(f?f(x):x),0);
function newId(p){ return (p||"r")+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

function defaults(){
  const y=new Date().getFullYear()-1;
  return {v:1,client:{name:"",address:"",city:"",ye:`${y}-12-31`},kap:{partner:"",address:"",phone:"",email:""},
    mat:{om:"",pm:"",tr:""},team:{prep:"",rev:""},accounts:[],wp:{},disc:{},overall:"",
    memo:{nature:"",analytic:"",findings:""},opname:[],
    conf:{letterNo:"",letterDate:"",signer:"",signerTitle:"",withBal:true,lang:"id",feeAcct:"",banks:{},acc:{},other:""},
    cutPay:{days:5,rows:[]},cutRec:{days:5,rows:[]},rates:{},rateSrc:"",aje:[],notes:{},sign:{},updatedAt:0};
}
function normalize(d){
  const b=defaults(), s=Object.assign({},b,JSON.parse(JSON.stringify(d||{})));
  ["client","kap","mat","team","memo","conf","cutPay","cutRec"].forEach(k=>s[k]=Object.assign({},b[k],s[k]||{}));
  ["accounts","opname","aje"].forEach(k=>{ if(!Array.isArray(s[k])) s[k]=[]; });
  ["wp","disc","rates","notes","sign"].forEach(k=>{ if(!s[k]||typeof s[k]!=="object"||Array.isArray(s[k])) s[k]={}; });
  if(!Array.isArray(s.cutPay.rows)) s.cutPay.rows=[]; if(!Array.isArray(s.cutRec.rows)) s.cutRec.rows=[];
  s.conf.banks=s.conf.banks||{}; s.conf.acc=s.conf.acc||{};
  s.accounts.forEach(a=>{ a.id=a.id||newId("a"); a.type=a.type||"bank"; a.cur=(a.cur||"IDR").toUpperCase(); });
  s.opname.forEach(o=>{ o.id=o.id||newId("o"); o.den=o.den||{}; o.coin=o.coin||{}; o.others=Array.isArray(o.others)?o.others:[]; });
  return s;
}

let C=null;
function recalc(){
  const s=S, ye=s.client.ye, c={acc:{},byType:{},adj:{},issues:[]};
  // AJE per akun
  s.aje.forEach(j=>{ if(j.acct) c.adj[j.acct]=(c.adj[j.acct]||0)+num(j.dr)-num(j.cr); });
  c.ajeDr=sum(s.aje,j=>j.dr); c.ajeCr=sum(s.aje,j=>j.cr);
  s.accounts.forEach(a=>{
    const adj=c.adj[a.id]||0, aud=num(a.book)+adj, py=num(a.py), chg=aud-py;
    c.acc[a.id]={adj,aud,chg,p:py?chg/Math.abs(py):(aud?null:0),bookCur:a.cur==="IDR"?num(a.book):num(a.fx)};
  });
  TYPES.forEach(([k])=>{ const rs=s.accounts.filter(a=>a.type===k);
    c.byType[k]={book:sum(rs,a=>a.book),adj:sum(rs,a=>c.acc[a.id].adj),aud:sum(rs,a=>c.acc[a.id].aud),py:sum(rs,a=>a.py)}; });
  const T=c.tot={book:sum(s.accounts,a=>a.book),adj:sum(s.accounts,a=>c.acc[a.id].adj),aud:sum(s.accounts,a=>c.acc[a.id].aud),py:sum(s.accounts,a=>a.py)};
  T.chg=T.aud-T.py; T.p=T.py?T.chg/Math.abs(T.py):null;
  // Opname + tarik mundur
  c.opn={};
  s.opname.forEach(o=>{
    const notes=sum(DEN_NOTE,d=>d*num(o.den[d])), coins=sum(DEN_COIN,d=>d*num(o.coin[d])), cashX=num(o.cashOther);
    const cash=notes+coins+cashX, docs=sum(o.others,x=>x.amt), total=cash+docs, diffBook=total-num(o.bookAtDate);
    const after=!o.date||!ye||o.date>ye; const recv=num(o.recv), disb=num(o.disb);
    const calcYE=after? total-recv+disb : total+recv-disb;
    const a=s.accounts.find(x=>x.id===o.acct); const bookYE=a?num(a.book):num(o.bookYE);
    c.opn[o.id]={notes,coins,cash,docs,total,diffBook,after,calcYE,bookYE,diffYE:calcYE-bookYE,acct:a};
  });
  // Konfirmasi
  c.conf=s.accounts.filter(a=>a.type!=="kas").map(a=>{
    const e=s.conf.acc[a.id]||{}, bk=(a.bank||"").trim()||tt("(bank belum diisi)","(bank not set)"), b=s.conf.banks[bk.replace(/\./g,"_")]||{};
    const hasReply=e.reply!==""&&e.reply!=null; const bc=c.acc[a.id].bookCur; const diff=hasReply?bc-num(e.reply):null;
    let st=e.status||""; if(!st) st=hasReply?(Math.abs(diff)<0.005?"CB":"Rd"):(b.sent?"NR":"");
    return {a,e,bank:bk,b,hasReply,bookCur:bc,diff,st};
  });
  c.banks=[...new Set(c.conf.map(r=>r.bank))];
  // Cut-off
  c.cp=s.cutPay.rows.map(r=>{ const rel=r.released||r.vdate; const should=rel?rel<=ye:null, incl=r.recorded?r.recorded<=ye:null;
    return {should,incl,adj:should!=null&&incl!=null?should!==incl:null}; });
  c.cr=s.cutRec.rows.map(r=>{ const should=r.date?r.date<=ye:null, incl=r.recorded?r.recorded<=ye:null;
    return {should,incl,adj:should!=null&&incl!=null?should!==incl:null}; });
  // Valas
  c.fx=s.accounts.filter(a=>a.cur!=="IDR").map(a=>{ const rate=num(s.rates[a.cur]); const aud=r2(num(a.fx)*rate); return {a,rate,audit:aud,diff:r2(num(a.book)-aud)}; });
  // Isu
  const tr=num(s.mat.tr);
  const big=v=>Math.abs(v)>Math.max(tr,0.5);
  s.opname.forEach(o=>{ const x=c.opn[o.id]; const nm=x.acct?x.acct.name:tt("kas","cash");
    if(big(x.diffBook)) c.issues.push({tab:"ba",t:tt(`Selisih opname ${nm}: ${fmt(x.diffBook)} (fisik vs buku per tanggal opname)`,`Cash count difference ${nm}: ${fmt(x.diffBook)} (count vs book at count date)`)});
    if(big(x.diffYE)) c.issues.push({tab:"tm",t:tt(`Selisih tarik mundur ${nm}: ${fmt(x.diffYE)} — perlu penjelasan`,`Roll-back difference ${nm}: ${fmt(x.diffYE)} — needs explanation`)}); });
  c.conf.forEach(r=>{ if(r.st==="Rd"&&!(r.e.note||"").trim()) c.issues.push({tab:"conf",t:tt(`Konfirmasi ${r.bank} ${r.a.accNo||""}: selisih ${fmt(r.diff,r.a.cur==="IDR"?0:2)} ${r.a.cur}`,`Confirmation ${r.bank} ${r.a.accNo||""}: difference ${fmt(r.diff,r.a.cur==="IDR"?0:2)} ${r.a.cur}`)});
    if(r.st==="NR") c.issues.push({tab:"conf",t:tt(`Konfirmasi ${r.bank} ${r.a.accNo||""} belum dijawab — lakukan prosedur alternatif`,`Confirmation ${r.bank} ${r.a.accNo||""} not replied — perform alternative procedures`)}); });
  const noConf=c.conf.filter(r=>!r.b.sent).length; if(noConf) c.issues.push({tab:"conf",t:tt(`${noConf} rekening bank/deposito belum dikirimi konfirmasi`,`${noConf} bank/deposit accounts not yet confirmed`)});
  const ajeRef=r=>s.aje.some(j=>(j.ref||"").includes(r));
  c.cp.forEach((x,i)=>{ if(x.adj&&!ajeRef(REF.cp)) c.issues.push({tab:"cp",t:tt(`Cut-off pengeluaran sampel ${i+1}: perlu penyesuaian ${fmt(s.cutPay.rows[i].amt)}`,`Disbursement cut-off sample ${i+1}: adjustment needed ${fmt(s.cutPay.rows[i].amt)}`)}); });
  c.cr.forEach((x,i)=>{ if(x.adj&&!ajeRef(REF.cr)) c.issues.push({tab:"cr",t:tt(`Cut-off penerimaan sampel ${i+1}: perlu penyesuaian ${fmt(s.cutRec.rows[i].amt)}`,`Receipts cut-off sample ${i+1}: adjustment needed ${fmt(s.cutRec.rows[i].amt)}`)}); });
  c.fx.forEach(x=>{ if(!x.rate) c.issues.push({tab:"fx",t:tt(`Kurs ${x.a.cur} per tanggal neraca belum diisi`,`${x.a.cur} closing rate not entered`)});
    else if(big(x.diff)&&!(Math.abs((c.adj[x.a.id]||0)+x.diff)<0.5)) c.issues.push({tab:"fx",t:tt(`Selisih penjabaran ${x.a.name}: ${fmt(x.diff)} belum diusulkan penyesuaian`,`Restatement difference ${x.a.name}: ${fmt(x.diff)} not yet adjusted`)}); });
  if(Math.abs(c.ajeDr-c.ajeCr)>0.5) c.issues.push({tab:"aje",t:tt(`Usulan penyesuaian tidak seimbang: debit ${fmt(c.ajeDr)} vs kredit ${fmt(c.ajeCr)}`,`Proposed adjustments do not balance: debit ${fmt(c.ajeDr)} vs credit ${fmt(c.ajeCr)}`)});
  s.accounts.forEach(a=>{ if(a.cur!=="IDR"&&!num(a.fx)) c.issues.push({tab:"lead",t:tt(`${a.name}: saldo valas belum diisi`,`${a.name}: foreign-currency balance missing`)});
    if(num(a.book)<0) c.issues.push({tab:"lead",t:tt(`${a.name}: saldo kredit (cerukan) — pertimbangkan reklasifikasi ke liabilitas`,`${a.name}: credit balance (overdraft) — consider reclassification to liabilities`)}); });
  C=c; return c;
}

let db=null,userCap=null,dl=null,readOnly=false,mode="init";
const docs=new Map(); let curId=null,S=null,dirty=false,saving=false,saveTimer=null,ver=0;
let tab="info"; try{ tab=localStorage.getItem("kas-tab")||tab; }catch(_){}
const COL="kertaskerja", LS="kas-lokal";
function lsGet(){ try{ return JSON.parse(localStorage.getItem(LS)||"{}"); }catch(_){ return {}; } }
function lsSet(o){ try{ localStorage.setItem(LS,JSON.stringify(o)); }catch(_){} }
function setStatus(t){ document.getElementById("saveStatus").textContent=t; }
async function persist(id,data){
  if(mode==="db") await db.collection(COL).doc(id).set(data);
  else { const o=lsGet(); o[id]=data; lsSet(o); }
}
async function removeDoc(id){
  if(mode==="db") await db.collection(COL).doc(id).delete();
  else { const o=lsGet(); delete o[id]; lsSet(o); }
  docs.delete(id);
}
function markDirty(){
  if(readOnly||!curId) return;
  dirty=true; ver++; setStatus(tt("Belum tersimpan…","Unsaved…"));
  clearTimeout(saveTimer); saveTimer=setTimeout(flush,700);
}
async function flush(){
  if(!dirty||!curId) return;
  if(saving){ clearTimeout(saveTimer); saveTimer=setTimeout(flush,400); return; }
  saving=true; const v=ver, id=curId; S.updatedAt=Date.now();
  const data=JSON.parse(JSON.stringify(S));
  try{ await persist(id,data); docs.set(id,data); if(v===ver) dirty=false; setStatus(mode==="db"?tt("Tersimpan","Saved"):tt("Tersimpan di browser ini","Saved in this browser")); }
  catch(err){
    const code=err&&err.code;
    if(code==="invalid_argument"||code==="permission_denied"){ readOnly=true; setStatus(tt("Hanya baca","Read only")); renderBanner(); render(); }
    else if(code==="quota_exceeded") setStatus(tt("Penyimpanan penuh — hapus kertas kerja lama","Storage full — delete old files"));
    else { setStatus(tt("Gagal menyimpan, mencoba lagi…","Save failed, retrying…")); setTimeout(flush,2000+Math.random()*1000); }
  } finally { saving=false; if(dirty&&ver!==v){ clearTimeout(saveTimer); saveTimer=setTimeout(flush,300); } }
}
function openDoc(id){
  if(dirty) flush();
  curId=id; S=normalize(docs.get(id)); dirty=false;
  try{ localStorage.setItem("kas-cur",id); }catch(_){}
  recalc(); renderPicker(); render();
}
async function createDoc(data){
  const id=newId("k"); const d=normalize(data); d.updatedAt=Date.now();
  docs.set(id,JSON.parse(JSON.stringify(d)));
  try{ await persist(id,JSON.parse(JSON.stringify(d))); }catch(_){ setStatus(tt("Gagal membuat","Create failed")); }
  tab="info"; openDoc(id);
}
function onDocs(){
  if(curId&&docs.has(curId)){ renderPicker(); return; }
  let last=null; try{ last=localStorage.getItem("kas-cur"); }catch(_){}
  const ids=[...docs.keys()];
  if(last&&docs.has(last)) openDoc(last); else if(ids.length) openDoc(ids.sort((a,b)=>(docs.get(b).updatedAt||0)-(docs.get(a).updatedAt||0))[0]);
  else { curId=null; S=null; renderPicker(); render(); }
}

R.lead=()=>{
  const s=S, c=C;
  const typeOpts=TYPES.map(t=>[t[0],tt(t[1],t[2])]);
  let body="";
  TYPES.forEach(([k])=>{
    const rs=s.accounts.map((a,i)=>[a,i]).filter(([a])=>a.type===k);
    body+=`<tr class="sec"><td colspan="17">${esc(typeLbl(k))}</td></tr>`;
    rs.forEach(([a,i])=>{ const x=c.acc[a.id], p=`accounts.${i}`;
      body+=`<tr><td>${I(p+".type",{t:"sel",opts:typeOpts})}</td><td>${I(p+".name",{c:"txt"})}</td><td>${I(p+".bank",{c:"md",ph:k==="kas"?"—":"Bank …"})}</td><td>${I(p+".accNo",{c:"md"})}</td><td>${I(p+".cur",{c:"sm"})}</td>
      <td>${a.cur==="IDR"?"":I(p+".fx",{t:"num"})}</td><td>${I(p+".book",{t:"num"})}</td><td class="n">${fmt(x.adj)}</td><td class="n"><b>${fmt(x.aud)}</b></td><td>${I(p+".py",{t:"num"})}</td>
      <td class="n">${fmt(x.chg)}</td><td class="n">${pct(x.p)}</td><td class="c">${I(p+".tb",{t:"check",al:"TB"})}</td><td class="c">${I(p+".pyok",{t:"check",al:"PY"})}</td><td class="c">${I(p+".rp",{t:"check",al:"RP"})}</td><td class="c">${I(p+".restr",{t:"check",al:"restricted"})}</td>
      <td><button class="x" data-act="delAcct" data-i="${i}" aria-label="${tt("Hapus","Delete")}" ${RO()}>×</button></td></tr>`; });
    const t=c.byType[k];
    body+=`<tr class="tot"><td colspan="6">${tt("Sub-jumlah","Sub-total")} ${esc(typeLbl(k))}</td><td class="n">${fmt(t.book)}</td><td class="n">${fmt(t.adj)}</td><td class="n">${fmt(t.aud)}</td><td class="n">${fmt(t.py)}</td><td class="n">${fmt(t.aud-t.py)}</td><td class="n">${pct(t.py?(t.aud-t.py)/Math.abs(t.py):null)}</td><td colspan="5"></td></tr>`;
  });
  const T=c.tot;
  body+=`<tr class="grand"><td colspan="6">${tt("JUMLAH KAS DAN SETARA KAS","TOTAL CASH AND CASH EQUIVALENTS")}</td><td class="n">${fmt(T.book)}</td><td class="n">${fmt(T.adj)}</td><td class="n">${fmt(T.aud)}</td><td class="n">${fmt(T.py)}</td><td class="n">${fmt(T.chg)}</td><td class="n">${pct(T.p)}</td><td colspan="5"></td></tr>`;
  // ringkasan klasifikasi
  const grp=(f)=>{ const m={}; s.accounts.forEach(a=>{ const k=f(a); m[k]=(m[k]||0)+c.acc[a.id].aud; }); return Object.entries(m); };
  const cls=[[tt("Pihak","Party"),grp(a=>a.rp?tt("Pihak berelasi","Related parties"):tt("Pihak ketiga","Third parties"))],[tt("Mata uang","Currency"),grp(a=>a.cur)],[tt("Pembatasan","Restriction"),grp(a=>a.restr?tt("Dibatasi / dijaminkan","Restricted / pledged"):tt("Bebas digunakan","Unrestricted"))]];
  return head("lead",tt("Lead Schedule Kas dan Setara Kas","Cash and Cash Equivalents Lead Schedule"),tt("dalam Rupiah","in Rupiah"))+
  `<div class="toolbar"><button class="primary" data-act="addAcct" ${RO()}>${tt("+ Tambah akun","+ Add account")}</button><button data-act="pasteAcct" ${RO()}>${tt("Tempel dari Excel","Paste from Excel")}</button>
   <span class="small muted">${tt("Penyesuaian otomatis dari tab Usulan Penyesuaian. Saldo valas wajib untuk akun non-IDR.","Adjustments flow from the Proposed Adjustments tab. Foreign balance required for non-IDR accounts.")}</span></div>
  <div class="scroll"><table><thead><tr><th>${tt("Jenis","Type")}</th><th>${tt("Uraian","Description")}</th><th>Bank</th><th>${tt("No. rekening","Account no.")}</th><th>${tt("Mata uang","Ccy")}</th><th class="n">${tt("Saldo valas","Foreign balance")}</th><th class="n">${tt("Saldo per buku","Per book")} ${fmtDs(s.client.ye)}</th><th class="n">${tt("Penyesuaian","Adjustments")}</th><th class="n">${tt("Saldo per audit","Per audit")}</th><th class="n">${tt("Audit th lalu","Prior year audited")}</th><th class="n">${tt("Naik (turun)","Inc (dec)")}</th><th class="n">%</th><th class="c" title="${tt("Cocok dengan neraca saldo","Agreed with trial balance")}">TB</th><th class="c" title="${tt("Cocok dengan LK auditan tahun lalu","Agreed with prior-year audited")}">PY</th><th class="c" title="${tt("Pihak berelasi","Related party")}">${tt("Berelasi","RP")}</th><th class="c" title="${tt("Dibatasi / dijaminkan","Restricted / pledged")}">${tt("Dibatasi","Restr.")}</th><th></th></tr></thead><tbody>${body}</tbody></table></div>
  <p class="small muted">Tickmarks: <b>TB</b> ${tt("cocok dengan neraca saldo","agreed with trial balance")} · <b>PY</b> ${tt("cocok dengan saldo auditan tahun lalu","agreed with prior year audited balance")}</p>
  <h3>${tt("Klasifikasi untuk pengungkapan","Classification for disclosure")}</h3>
  <div class="two">${cls.map(([h,rows])=>`<div class="scroll"><table><thead><tr><th>${h}</th><th class="n">${tt("Saldo per audit","Per audit")}</th></tr></thead><tbody>${rows.map(([k,v])=>`<tr><td>${esc(k)}</td><td class="n">${fmt(v)}</td></tr>`).join("")}</tbody></table></div>`).join("")}</div>`;
};
